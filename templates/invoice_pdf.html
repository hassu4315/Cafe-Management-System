<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table, th, td { border: 1px solid #000; }
        th, td { padding: 8px; text-align: left; }
        h2 { margin-bottom: 0; }
    </style>
</head>
<body>

<h2>☕︎ 𝐑𝐎𝐘𝐀𝐋 𝐂𝐀𝐅𝐄 #{{ bill[0] }}</h2>
<p>Date: {{ bill[2] }}</p>

<table>
    <thead>
        <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody>
        {% for i in items %}
        <tr>
            <td>{{ i[0] }}</td>
            <td>{{ i[1] }}</td>
            <td>{{ i[2] }}</td>
            <td>{{ i[1] * i[2] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<h3 style="text-align:right;">Grand Total: ₹ {{ bill[1] }}</h3>

</body>
</html>
