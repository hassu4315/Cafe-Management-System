{% extends "layout.html" %}
{% block content %}

<h3 class="mb-4">Add Item</h3>

<form method="POST">

    <div class="mb-3">
        <label>Item Name</label>
        <input class="form-control" name="name" placeholder="Enter item name">
    </div>

    <div class="mb-3">
        <label>Price</label>
        <input class="form-control" name="price" type="number" step="0.01" placeholder="Enter price">
    </div>

    <div class="mb-3">
        <label>Category</label>
        <select class="form-control" name="category" required>
            <option value="">Select category</option>
            {% for c in categories %}
                <option value="{{ c[0] }}">{{ c[1] }}</option>
            {% endfor %}
        </select>
    </div>

    <button class="btn btn-dark w-100">Add Item</button>

</form>

{% endblock %}
