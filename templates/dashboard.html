{% extends "layout.html" %}
{% block content %}

<h3 class="mb-4">Dashboard</h3>

<div class="row g-3">

    <div class="col-md-4 col-6">
        <div class="card text-center p-3 shadow-sm">
            <h4>{{ total_items }}</h4>
            <p>Total Items</p>
        </div>
    </div>

    <div class="col-md-4 col-6">
        <div class="card text-center p-3 shadow-sm">
            <h4>{{ cat_count }}</h4>
            <p>Categories</p>
        </div>
    </div>

    <div class="col-md-4 col-6">
        <div class="card text-center p-3 shadow-sm">
            <h4>₹ {{ total_value }}</h4>
            <p>Total Value</p>
        </div>
    </div>

</div>

{% endblock %}
