{% extends "layout.html" %}
{% block content %}

<h3 class="mb-3"> Royal Items</h3>

<a class="btn btn-dark mb-3" href="/add">Add Item</a>

<div class="table-responsive">
<table class="table table-striped table-bordered shadow-sm">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price (₹)</th>
            <th>Category</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for i in items %}
        <tr>
            <td>{{ i[0] }}</td>
            <td>{{ i[1] }}</td>
            <td>{{ i[2] }}</td>
            <td>{{ i[3] or 'Uncategorized' }}</td>

            <td>
                <a href="/edit/{{ i[0] }}" class="btn btn-sm btn-warning">Edit</a>
                <a href="/delete/{{ i[0] }}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>

{% endblock %}
