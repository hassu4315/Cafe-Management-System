{% extends "layout.html" %}
{% block content %}

<h3 class="mb-3">Sales Report (Date Range)</h3>

<form method="POST" class="mb-4">
    <label><b>From:</b></label>
    <input type="date" name="start" value="{{ start_date }}" required>

    <label class="ms-3"><b>To:</b></label>
    <input type="date" name="end" value="{{ end_date }}" required>

    <button class="btn btn-dark btn-sm ms-2">View</button>
</form>

<h4>Total Revenue (₹): {{ total_revenue }}</h4>

<hr>

<table class="table table-bordered table-striped mt-3">
    <thead class="table-dark">
        <tr>
            <th>Bill ID</th>
            <th>Amount (₹)</th>
            <th>Date</th>
            <th>View</th>
        </tr>
    </thead>

    <tbody>
        {% for b in data %}
        <tr>
            <td>{{ b[0] }}</td>
            <td>{{ b[1] }}</td>
            <td>{{ b[2] }}</td>
            <td>
                <a href="/invoice/{{ b[0] }}" class="btn btn-sm btn-primary">Invoice</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
