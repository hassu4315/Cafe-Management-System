{% extends "layout.html" %}
{% block content %}

<h2 class="mb-3">𝐑𝐎𝐘𝐀𝐋 𝐂𝐀𝐅𝐄 #{{ bill[0] }}</h2>
<p>Date: {{ bill[2] }}</p>

<table class="table table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody>
        {% for i in items %}
        <tr>
            <td>{{ i[0] }}</td>
            <td>{{ i[1] }}</td>
            <td>{{ i[2] }}</td>
            <td>{{ i[1] * i[2] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<h3 class="text-end">Grand Total: ₹ {{ bill[1] }}</h3>

<a href="/invoice/{{ bill[0] }}/pdf" class="btn btn-dark mt-3">Download PDF</a>

{% endblock %}
