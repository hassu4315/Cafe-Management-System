{% extends "layout.html" %}
{% block content %}

<h3 class="mb-4">POS Billing</h3>

<!-- CATEGORY FILTER BUTTONS -->
<div class="mb-3">
    <button class="btn btn-dark btn-sm me-2 category-btn" data-category="all">All</button>

    {% for c in categories %}
    <button class="btn btn-outline-dark btn-sm me-2 category-btn" data-category="{{ c[1] }}">
        {{ c[1] }}
    </button>
    {% endfor %}
</div>


<div class="row">

    <!-- LEFT ITEMS -->
    <div class="col-md-7">
        <div class="row g-2">

            {% for it in items %}
            <div class="col-md-4 col-6">
                <button class="btn btn-outline-dark w-100 item-btn add-btn"
                        data-name="{{ it[1] }}"
                        data-price="{{ it[2] }}"
                        data-category="{{ it[3] }}">

                    {{ it[1] }} <br>
                    <b>₹ {{ it[2] }}</b>
                </button>
            </div>
            {% endfor %}

        </div>
    </div>

    <!-- RIGHT CART -->
    <div class="col-md-5">
        <div class="card p-3 shadow-sm">
            <h4>Cart</h4>
            <ul id="cart" class="list-group mb-3"></ul>
            <h4>Total: ₹<span id="total">0</span></h4>
            <button id="checkout" class="btn btn-dark w-100 mt-3">Checkout</button>
        </div>
    </div>

</div>

<script>
// ---------------- CATEGORY FILTER ----------------
document.querySelectorAll(".category-btn").forEach(btn => {
    btn.addEventListener("click", () => {

        const cat = btn.dataset.category;

        document.querySelectorAll(".category-btn").forEach(b => {
            b.classList.remove("btn-dark");
            b.classList.add("btn-outline-dark");
        });

        btn.classList.remove("btn-outline-dark");
        btn.classList.add("btn-dark");

        document.querySelectorAll(".item-btn").forEach(item => {
            if (cat === "all" || item.dataset.category === cat) {
                item.style.display = "block";
            } else {
                item.style.display = "none";
            }
        });

    });
});


// ---------------- CART SYSTEM ----------------
let cart = [];

function renderCart() {
    let list = document.getElementById("cart");
    list.innerHTML = "";
    let total = 0;

    cart.forEach((item, idx) => {
        let sub = item.qty * item.price;
        total += sub;

        list.innerHTML += `
            <li class="list-group-item d-flex justify-content-between">
                ${item.name} x${item.qty} - ₹${sub}
                <button class="btn btn-sm btn-danger" onclick="removeItem(${idx})">X</button>
            </li>
        `;
    });

    document.getElementById("total").textContent = total;
}

function removeItem(i) {
    cart.splice(i, 1);
    renderCart();
}

document.querySelectorAll(".add-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        let name = btn.dataset.name;
        let price = parseFloat(btn.dataset.price);

        let found = cart.find(i => i.name === name);

        if (found) found.qty++;
        else cart.push({ name, price, qty: 1 });

        renderCart();
    });
});


// ---------------- CHECKOUT ----------------
document.getElementById("checkout").addEventListener("click", () => {
    if (cart.length === 0) return alert("Cart is empty!");

    fetch("/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cart)
    })
    .then(r => r.json())
    .then(d => {
        window.location.href = "/invoice/" + d.bill_id;
    });
});
</script>

{% endblock %}
