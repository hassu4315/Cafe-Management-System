{% extends "layout.html" %}
{% block content %}

<h3 class="mb-4">Edit Category</h3>

<form method="POST" class="card p-4 shadow-sm" style="max-width:400px;">
    <label class="form-label">Category Name:</label>
    <input type="text" name="name" value="{{ category[1] }}" class="form-control" required>

    <button class="btn btn-dark mt-3">Save Changes</button>
</form>

{% endblock %}
