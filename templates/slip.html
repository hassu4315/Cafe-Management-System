<!DOCTYPE html>
<html>
<head>
    <title>Receipt Slip</title>
    <style>
        body {
            font-family: monospace;
            width: 300px;
        }
        .center { text-align: center; }
        .line { border-bottom: 1px dashed black; margin: 8px 0; }
    </style>
</head>
<body>

<div class="center">
    <h3>𝐑𝐎𝐘𝐀𝐋 𝐂𝐀𝐅𝐄</h3>
</div>

<div class="line"></div>

<p><b>Bill ID:</b> {{ bill[0] }}</p>
<p><b>Date:</b> {{ bill[2] }}</p>

<div class="line"></div>

<table style="width:100%; font-size:14px;">
    {% for name, qty, price in items %}
    <tr>
        <td>{{ name }} x{{ qty }}</td>
        <td style="text-align:right;">₹{{ qty * price }}</td>
    </tr>
    {% endfor %}
</table>

<div class="line"></div>

<h3>Total: ₹{{ bill[1] }}</h3>

<div class="line"></div>

<p class="center">Thank you!</p>

<script>
    window.print();
</script>

</body>
</html>
